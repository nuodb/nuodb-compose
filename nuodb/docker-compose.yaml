
networks:
  net:

services:
  nuoadmin1:
    image: $NUODB_IMAGE
    # profiles: [ "distributed" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      NUODB_DOMAIN_ENTRYPOINT: ${PEER_ADDRESS:-nuoadmin1}
    hostname: ${PEER_ADDRESS:-nuoadmin1}
    ports:
      - 48004-48005:48004-48005
      - 8888:8888
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
      - ${LICENSE_PATH:-./empty-file}:/etc/nuodb/nuodb.lic
    
    command: [ "/usr/local/scripts/start-nuoadmin" ]

  sm1:
    image: $NUODB_IMAGE
    # profiles: [ "distributed" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      ARCHIVE_DIR: ${ARCHIVE_PATH:-/var/opt/nuodb/archive}
      DB_OPTIONS: "mem ${ENGINE_MEM:-1Gi} execution-engine ${SQL_ENGINE:-vee} ${ENGINE_OPTIONS:-}"
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
    hostname: sm1
    depends_on:
      - nuoadmin1
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
      - ${IMPORT_LOCAL:-./empty-file}:${IMPORT_MOUNT:-/var/tmp/env}

    command: [ "/usr/local/scripts/start-nuosm" ]

  sm2:
    image: $NUODB_IMAGE
    profiles: [ "scale-sm2" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      ARCHIVE_DIR: ${ARCHIVE_PATH:-/var/opt/nuodb/archive}
      DB_OPTIONS: "mem ${ENGINE_MEM:-1Gi} execution-engine ${SQL_ENGINE:-vee} ${ENGINE_OPTIONS:-}"
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
    hostname: sm2
    depends_on:
      - nuoadmin1
      - sm1

    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
      - ${IMPORT_LOCAL:-./empty-file}:${IMPORT_MOUNT:-/var/tmp/env}

    command: [ "/usr/local/scripts/start-nuosm" ]
  te1:
    image: $NUODB_IMAGE
    # profiles: [ "distributed" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
      EXTERNAL_ADDRESS: ${EXTERNAL_ADDRESS:-te1}
      ENGINE_PORT: "48006"
    hostname: te1
    depends_on:
      - nuoadmin1
      - sm1
    ports:
      - 48006:48006
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb

    command: [ "/usr/local/scripts/start-nuote" ]

  te2:
    image: $NUODB_IMAGE
    profiles: [ "scale-te2", "scale-te3", "scale-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
      EXTERNAL_ADDRESS: ${EXTERNAL_ADDRESS:-te2}
      ENGINE_PORT: "48007"
    hostname: te2
    depends_on:
      - nuoadmin1
      - sm1

    ports:
      - 48007:48007
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
    
    command: [ "/usr/local/scripts/start-nuote" ]

  te3:
    image: $NUODB_IMAGE
    profiles: [ "scale-te3", "scale-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
      EXTERNAL_ADDRESS: ${EXTERNAL_ADDRESS:-te2}
      ENGINE_PORT: "48008"
    hostname: te3
    depends_on:
      - nuoadmin1
      - sm1

    ports:
      - 48008:48008
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
    
    command: [ "/usr/local/scripts/start-nuote" ]

  te4:
    image: $NUODB_IMAGE
    profiles: [ "scale-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    # Do NOT remove this env_file value!!
    env_file: .env

    environment:
      PEER_ADDRESS: ${PEER_ADDRESS:-nuoadmin1}
      NUOCMD_API_SERVER: ${PEER_ADDRESS:-nuoadmin1}:8888
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-90}
      EXTERNAL_ADDRESS: ${EXTERNAL_ADDRESS:-te2}
      ENGINE_PORT: "48009"
    hostname: te4
    depends_on:
      - nuoadmin1
      - sm1

    ports:
      - 48009:48009
    volumes:
      - ./scripts:/usr/local/scripts
      - ./scripts/stop-nuodb:/usr/local/bin/stop-nuodb
    
    command: [ "/usr/local/scripts/start-nuote" ]

  influxdb:
    image: influxdb:1.8
    profiles: [ "insights" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:    

    # ports:
      # The API for InfluxDB is served on port 8086
      # - "8086:8086"
      # - "8082:8082"
    volumes:
      - ./conf/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh

  nuocd-sm1:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - sm1
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: sm1
    pid: 'service:sm1'

  nuocd-sm2:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights-sm2" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - sm2
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: sm1
    pid: 'service:sm1'

  nuocd-te1:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - te1
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: te1
    pid: 'service:te1'

  nuocd-te2:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights-te2", "insights-te3", "insights-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - te2
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: te2
    pid: 'service:te2'

  nuocd-te3:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights-te3", "insights-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - te3
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: te3
    pid: 'service:te3'

  nuocd-te4:
    image: nuodb/nuodb-collector:latest
    profiles: [ "insights-te4" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - nuoadmin1
      - te4
      - influxdb
    environment:
      INFLUXURL: http://influxdb:8086
      NUOCD_HOSTNAME: te4
    pid: 'service:te4'

  grafana:
    image: grafana/grafana:7.5.4
    profiles: [ "insights" ]
    restart: ${RESTART_POLICY:-unless-stopped}

    networks:
      net:

    depends_on:
      - influxdb
    environment:
      INFLUX_HOST: influxdb
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"

